[package]
name = "prismagram"
version = "0.4.0"
description = "Turn Prisma schemas into UML class diagrams"
authors = ["Prismagram contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "prismagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
prismagram-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
base64 = "0.22"
tokio-postgres = "0.7"
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["time"] }
webpki-roots = "1"
mongodb = "3"
# Saved connection strings and passwords live in the OS keychain: Keychain on macOS,
# Credential Manager on Windows, Secret Service (GNOME Keyring, KWallet) on Linux.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
futures-util = "0.3.34"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
