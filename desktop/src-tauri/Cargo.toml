[package]
name = "prismagram"
version = "0.1.0"
description = "Turn Prisma schemas into UML class diagrams"
authors = ["Prismagram contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "prismagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
prismagram-core = { path = "../../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
